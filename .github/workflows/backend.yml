name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "infra/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL (PostGIS + pgvector) ve Redis'i başlat
        working-directory: .
        run: docker compose -f infra/docker-compose.yml up -d --build --wait db redis

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Migration
        run: uv run --no-sync alembic upgrade head

      - name: Testler
        run: uv run --no-sync pytest -q
